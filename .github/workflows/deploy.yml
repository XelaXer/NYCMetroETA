name: Build

# Builds and pushes the image. Deploying is Flux's job (homelab-k3s, KAN-120):
# it lists tags in the registry, picks the newest `<commit-epoch>-<sha7>` tag,
# commits it to homelab-k3s and rolls it out. Nothing here touches the cluster.
#
# The sortable tag uses the commit's own timestamp, not the build's, so
# re-running an old build can't jump ahead of a newer commit.

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sortable tag
        id: tag
        run: echo "v=$(git log -1 --format=%ct)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: docker.nyc.xelaxer.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./metro_api
          push: true
          platforms: linux/amd64
          tags: |
            docker.nyc.xelaxer.com/nyc_metro_eta:${{ steps.tag.outputs.v }}
            docker.nyc.xelaxer.com/nyc_metro_eta:${{ github.sha }}
            docker.nyc.xelaxer.com/nyc_metro_eta:latest
